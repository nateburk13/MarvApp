name: Send daily quote notification

on:
  schedule:
    # Target send time: 15:00 UTC = 8:00 AM Arizona (MST, UTC-7, no DST).
    # GitHub's scheduled runs are best-effort and often start 10-60 min late,
    # so we start ~40 min EARLY on an off-peak minute (not :00). The script
    # then waits until the exact send time (see waitUntilSendTime).
    - cron: '20 14 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send today's quote
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run send-quote