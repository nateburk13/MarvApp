name: Send daily quote notification

on:
  schedule:
    # '0 15 * * *' 15:00 UTC ≈ 8:00 AM Mountain Time (adjust for your timezone / DST as needed)
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send today's quote
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_TOKENS: ${{ secrets.FCM_TOKENS }}
        run: npm run send-quote
