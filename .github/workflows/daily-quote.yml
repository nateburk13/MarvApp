name: Send daily quote notification

on:
  schedule:
    # 15:00 UTC = 8:00 AM Arizona time (MST, UTC-7). Arizona does not
    # observe Daylight Saving Time, so this stays accurate year-round
    # with no seasonal adjustment needed.
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send today's quote
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run send-quote
