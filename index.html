<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Ashton</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ashton">
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging-compat.js"></script>
<style>
  :root{
    --ink:#14213d;
    --ink-deep:#0c162c;
    --parchment:#f6efe1;
    --parchment-line:#e4d8bd;
    --gold:#b98b3e;
    --gold-soft:#d9b877;
    --ember:#8f4a3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% -10%, #1c2c52 0%, var(--ink) 45%, var(--ink-deep) 100%);
    font-family: 'Iowan Old Style', 'Georgia', ui-serif, serif;
    color: var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: env(safe-area-inset-top,20px) 18px env(safe-area-inset-bottom,20px);
    overflow-x:hidden;
  }
  .stage{
    width:100%;
    max-width:430px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .datebar{
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--gold-soft);
    opacity:.85;
    text-align:center;
  }
  .card{
    position:relative;
    width:100%;
    background: var(--parchment);
    color:#241a0e;
    border-radius: 18px;
    padding: 30px 26px 26px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
    cursor:pointer;
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .card:active{ transform: scale(.985); }
  .ribbon{
    position:absolute; top:0; right:26px;
    width:14px; height:46px;
    background: linear-gradient(180deg, var(--ember), #6f3a2e);
    clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .portrait{
    width:96px; height:96px;
    margin: 4px auto 16px;
    border-radius:50%;
    background: linear-gradient(160deg, #d8c69a, #b98b3e 60%, #8a672c);
    display:flex; align-items:center; justify-content:center;
    border: 3px solid var(--gold);
    box-shadow: 0 6px 18px rgba(90,60,20,.35);
    overflow:hidden;
  }
  .portrait img{ width:100%; height:100%; object-fit:cover; display:block; }
  .portrait svg{ width:56%; height:56%; opacity:.75; }
  .quote-mark{
    font-family: Georgia, serif;
    font-size:54px;
    line-height:.4;
    color: var(--gold);
    opacity:.55;
    display:block;
    margin-bottom: 6px;
  }
  .quote-text{
    font-size: 22px;
    line-height:1.42;
    font-weight:500;
    letter-spacing:.1px;
  }
  .attribution{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }
  .attribution .line{ flex:1; height:1px; background: var(--parchment-line); }
  .attribution .name{
    font-size:12.5px;
    letter-spacing:.06em;
    color:#6b5a3a;
    white-space:nowrap;
    text-transform:uppercase;
  }
  .source{
    margin-top:8px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size:11.5px;
    color:#a08a5c;
    font-style:italic;
  }
  .hint{
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size:12px;
    color: rgba(246,239,225,.45);
    text-align:center;
  }
  .controls{
    display:flex;
    gap:10px;
    width:100%;
  }
  button{
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid rgba(217,184,119,.35);
    background: rgba(255,255,255,.04);
    color: var(--gold-soft);
    flex:1;
    cursor:pointer;
    transition: background .2s ease, transform .1s ease;
  }
  button:active{ transform: scale(.97); background: rgba(255,255,255,.09); }
  button.primary{
    background: linear-gradient(160deg, var(--gold-soft), var(--gold));
    color: var(--ink-deep);
    border: none;
  }
  .toast{
    position:fixed;
    bottom: calc(24px + env(safe-area-inset-bottom,0px));
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--parchment);
    color:#241a0e;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size:13px;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 360px){
    .quote-text{ font-size:20px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="datebar" id="datebar"></div>

  <div class="card" id="card">
    <div class="ribbon"></div>
    <div class="portrait" id="portrait">
      <!-- Placeholder silhouette. Replace this <svg> with an
           <img src="ashton.jpg"> of an authorized photo if you have one. -->
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="38" r="20" fill="#4a3419"/>
        <path d="M15 95c3-24 18-38 35-38s32 14 35 38" fill="#4a3419"/>
      </svg>
    </div>
    <span class="quote-mark">&ldquo;</span>
    <div class="quote-text" id="quoteText">Loading today&rsquo;s quote&hellip;</div>
    <div class="attribution">
      <div class="line"></div>
      <div class="name">Marvin J. Ashton</div>
      <div class="line"></div>
    </div>
    <div class="source" id="quoteSource"></div>
  </div>

  <div class="hint">Tap the card for another quote</div>

  <div class="controls">
    <button id="notifyBtn">Enable Reminder</button>
    <button id="shareBtn" class="primary">Share Quote</button>
  </div>

  <div id="tokenBox" style="display:none; width:100%;">
    <div class="hint" style="margin-bottom:6px;">Copy this into your FCM_TOKEN GitHub secret:</div>
    <textarea id="tokenText" readonly style="width:100%; min-height:70px; font-family:monospace; font-size:11px; padding:10px; border-radius:10px; border:1px solid rgba(217,184,119,.35); background:rgba(255,255,255,.06); color:#f6efe1; resize:none;"></textarea>
    <button id="copyTokenBtn" style="width:100%; margin-top:8px;">Copy Token</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ---- Quote data lives in quotes.json, loaded at startup ----
let QUOTES = [];
const FALLBACK_QUOTE = { text: "Leave people better than you found them.", source: "Be of Good Cheer, 1987" };

async function loadQuotes(){
  try {
    const res = await fetch('quotes.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('empty');
    QUOTES = data;
  } catch (e) {
    QUOTES = [FALLBACK_QUOTE];
    showToast('Couldn\'t load quotes.json — showing a fallback quote');
  }
  datebar.textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  render(todaysQuote());
}

// ---- Deterministic "quote of the day" based on today's date ----
function dayIndex(date){
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start;
  return Math.floor(diff / 86400000);
}
function todaysQuote(){
  const idx = dayIndex(new Date()) % QUOTES.length;
  return QUOTES[idx];
}
function randomQuote(exclude){
  let q;
  do { q = QUOTES[Math.floor(Math.random()*QUOTES.length)]; }
  while (QUOTES.length > 1 && q.text === exclude);
  return q;
}

const quoteText = document.getElementById('quoteText');
const quoteSource = document.getElementById('quoteSource');
const card = document.getElementById('card');
const datebar = document.getElementById('datebar');

function render(q){
  quoteText.textContent = q.text;
  quoteSource.textContent = q.source;
}

card.addEventListener('click', () => {
  card.style.transform = 'scale(.96)';
  setTimeout(() => { card.style.transform = ''; }, 150);
  render(randomQuote(quoteText.textContent));
});

// ---- Share ----
document.getElementById('shareBtn').addEventListener('click', async () => {
  const text = `"${quoteText.textContent}" — Marvin J. Ashton`;
  if (navigator.share) {
    try { await navigator.share({ text }); } catch(e) {}
  } else {
    await navigator.clipboard.writeText(text);
    showToast('Quote copied to clipboard');
  }
});

// ---- Firebase Cloud Messaging (handled in the module script below) ----
const notifyBtn = document.getElementById('notifyBtn');
const tokenBox = document.getElementById('tokenBox');
const tokenText = document.getElementById('tokenText');

window.__showToast = showToast;

window.__showFcmToken = function(token){
  notifyBtn.textContent = 'Reminder On';
  tokenText.value = token;
  tokenBox.style.display = 'block';
  showToast('Copy this token into your FCM_TOKEN secret');
};

document.getElementById('copyTokenBtn').addEventListener('click', async () => {
  tokenText.select();
  try {
    await navigator.clipboard.writeText(tokenText.value);
    showToast('Token copied');
  } catch (e) {
    showToast('Select the text and copy manually');
  }
});

async function setupNotifications(){
  notifyBtn.disabled = true;
  notifyBtn.textContent = 'Requesting…';
  await window.__enableFcmReminder();
  notifyBtn.disabled = false;
}

notifyBtn.addEventListener('click', setupNotifications);

loadQuotes();

// ---- Register service worker (enables install + offline caching) ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByENHdwEs3ggfkRXQe-kH1XyYP7tjabP8",
    authDomain: "marvappv2.firebaseapp.com",
    projectId: "marvappv2",
    storageBucket: "marvappv2.firebasestorage.app",
    messagingSenderId: "406149808601",
    appId: "1:406149808601:web:2dbbd9a2afdbe8e9c8d9c8"
  };
  const VAPID_KEY = "BNv_NhLWIO4LUtI4M3qItzrIRpn2TGl5UNrukHyTNKmK_Z5QPCSEW6lXu86wuW2AlbFeEe1WHT9zQga5oonPNj0"; // Get this from marvappv2 project settings → Cloud Messaging → Web Push certificates

  const firebaseApp = initializeApp(firebaseConfig);
  let messaging;
  try { messaging = getMessaging(firebaseApp); } catch (e) { /* unsupported browser */ }

  window.__enableFcmReminder = async function () {
    if (!messaging) {
      window.__showToast('Push isn\'t supported in this browser');
      return;
    }
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        window.__showToast('Notifications were not allowed');
        return;
      }
      // Use the single, already-registered sw.js (which now also handles
      // Firebase Cloud Messaging) instead of registering a second service
      // worker at the same scope — that used to cause the two workers to
      // silently replace each other and orphan the push subscription.
      const swReg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
      if (!token) {
        window.__showToast('Could not get a device token');
        return;
      }
      window.__showFcmToken(token);
    } catch (err) {
      console.error(err);
      window.__showToast('Something went wrong enabling notifications');
    }
  };

  // Foreground messages (app open and in view)
  if (messaging) {
    onMessage(messaging, (payload) => {
      const body = payload.notification?.body || '';
      if (body) window.__showToast(body);
    });
  }
</script>
</body>
</html>
